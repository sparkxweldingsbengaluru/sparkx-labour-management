<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sparkx Attendance</title>
    <link rel="stylesheet" href="style.css">
    <!-- Links your app to the free global Supabase engine -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-surface: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #15803d;
            --danger-bg: #ffe4e6;
            --danger-text: #be123c;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-surface);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px; /* Optimal reading/touch width for mobile & tablet */
            margin: 0 auto;
        }

        /* Mobile-first Horizontal Scroll Navigation */
        .menu {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 6px 4px 12px 4px;
            margin-bottom: 12px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Firefox */
        }

        .menu::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .menu a {
            text-decoration: none;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 14px;
            padding: 10px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
        }

        .menu a:active {
            transform: scale(0.96);
        }

        .menu a[href="attendance.html"] {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* App Header */
        .header-card {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            padding: 20px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
            box-shadow: var(--shadow-md);
        }

        .header-card h1 {
            font-size: 18px;
            font-weight: 800;
            margin: 0 0 4px 0;
            letter-spacing: -0.02em;
        }

        .header-card h2 {
            font-size: 13px;
            font-weight: 500;
            margin: 0;
            opacity: 0.85;
        }

        /* Main Form Card */
        .login-box {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        /* Form Inputs & Controls */
        .form-group {
            margin-bottom: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 420px) {
            .form-grid {
                grid-template-columns: 1fr; /* Stack on very small screens */
            }
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* 16px font-size stops iOS auto-zoom on field focus */
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            height: 48px; /* Touch target minimum standard */
            padding: 0 14px;
            font-size: 16px; 
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 500;
            transition: all 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%475569' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 40px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        #attendanceDate {
            font-weight: 700;
            color: var(--primary);
            border: 2px solid var(--primary);
            background-color: var(--primary-light);
        }

        .divider {
            border: 0;
            height: 1px;
            background: var(--border);
            margin: 20px 0;
        }

        /* Submit Button */
        button[type="submit"] {
            width: 100%;
            height: 52px;
            background-color: var(--primary);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        button[type="submit"]:active {
            transform: scale(0.98);
            background-color: var(--primary-hover);
        }

        button[type="submit"]:disabled {
            background-color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Recent Entries Section */
        h3 {
            font-size: 15px;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--text-main);
        }

        #recentEntriesContainer {
            max-height: 320px;
            overflow-y: auto;
            border-radius: var(--radius-md);
            background: #f8fafc;
            padding: 8px;
            border: 1px solid var(--border);
        }

        /* Modern List Cards */
        .entry-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .entry-card:last-child {
            margin-bottom: 0;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-present {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .badge-absent {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .btn-delete {
            background: #fff1f2;
            color: var(--danger-text);
            border: 1px solid #fecdd3;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-delete:active {
            background: var(--danger-text);
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="menu">
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="labour.html">👷 Labour</a>
        <a href="attendance.html">📅 Attendance</a>
        <a href="salary.html">💰 Salary</a>
        <a href="purchase_book.html">🛒 Purchase Book</a>
        <a href="reports.html">📄 Reports</a>
        <a href="index.html">Logout</a>
    </nav>
    
    <div class="header-card">
        <h1>Sparkx Welding & Fabrications</h1>
        <h2>Attendance Entry System</h2>
    </div>

    <div class="login-box">
        <div class="form-group">
            <label for="attendanceDate">Attendance Date</label>
            <input type="date" id="attendanceDate" onchange="renderRecentEntries()">
        </div>
        
        <hr class="divider">

        <form id="attendanceForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="labourSelect">Select Labour</label>
                    <select id="labourSelect" required>
                        <option value="">-- Choose Worker --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="attendanceStatus">Attendance Status</label>
                    <select id="attendanceStatus" onchange="toggleTimeFields()">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                </div>
            </div>

            <div id="timeFieldsWrapper">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="inTime">In Time</label>
                        <select id="inTime">
                            <option value="">-- Select In Time --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="outTime">Out Time</label>
                        <select id="outTime">
                            <option value="">-- Select Out Time --</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="otAmount">OT Amount (₹)</label>
                    <input type="number" id="otAmount" placeholder="₹" value="0">
                </div>
            </div>

            <div class="form-group">
                <label for="advanceAmount">Advance Given (₹)</label>
                <input type="number" id="advanceAmount" placeholder="₹" value="0">
            </div>

            <button type="submit" id="saveBtn">SAVE TO CLOUD</button>
        </form>

        <hr class="divider">
        
        <h3 id="recentTitle">Entries for this Date</h3>
        <div id="recentEntriesContainer">
            <p style="color: #64748b; font-style: italic; font-size: 14px; text-align: center; margin: 16px 0;">Loading cloud database records...</p>
        </div>
    </div>
</div>

<script>
// Cloud Database Connection Keys
const SUPABASE_URL = "https://fjzqscohyteznkehiqnf.supabase.co"; 
const SUPABASE_KEY = "sb_publishable_ER-PXAe4A1vsLDYETL4BKw_G7p24kTE"; 

const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

window.onload = function() {
    let today = new Date();
    let yyyy = today.getFullYear();
    let mm = String(today.getMonth() + 1).padStart(2, '0');
    let dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('attendanceDate').value = `${yyyy}-${mm}-${dd}`;
    
    populateTimeDropdowns();
    toggleTimeFields(); 
    renderRecentEntries();
};

let labourList = JSON.parse(localStorage.getItem('labourList')) || [
    { id: "1", name: "Javed", wage: 1300 }, 
    { id: "2", name: "Arbaj", wage: 1000 }
];
const selectEl = document.getElementById('labourSelect');

selectEl.innerHTML = '<option value="">-- Choose Worker --</option>';
labourList.forEach(w => {
    let opt = document.createElement('option');
    opt.value = w.id;
    opt.textContent = w.name;
    selectEl.appendChild(opt);
});

function populateTimeDropdowns() {
    const inTimeSelect = document.getElementById('inTime');
    const outTimeSelect = document.getElementById('outTime');
    const periods = ["AM", "PM"];
    const minutes = ["00", "15", "30", "45"];
    
    periods.forEach(period => {
        for (let h = 1; h <= 12; h++) {
            minutes.forEach(m => {
                let timeString = `${h}:${m} ${period}`;
                let optIn = document.createElement('option');
                optIn.value = timeString; optIn.textContent = timeString;
                inTimeSelect.appendChild(optIn);

                let optOut = document.createElement('option');
                optOut.value = timeString; optOut.textContent = timeString;
                outTimeSelect.appendChild(optOut);
            });
        }
    });
}

function toggleTimeFields() {
    const status = document.getElementById('attendanceStatus').value;
    const wrapper = document.getElementById('timeFieldsWrapper');
    if (status === "Absent") {
        wrapper.style.display = "none";
        document.getElementById('inTime').value = "";
        document.getElementById('outTime').value = "";
        document.getElementById('otAmount').value = "0";
    } else {
        wrapper.style.display = "block";
        document.getElementById('inTime').value = "8:00 AM";
        document.getElementById('outTime').value = "5:00 PM";
    }
}

async function renderRecentEntries() {
    const container = document.getElementById('recentEntriesContainer');
    const titleEl = document.getElementById('recentTitle');
    const selectedRawDate = document.getElementById('attendanceDate').value;
    
    if(!selectedRawDate) return;

    const [y, m, d] = selectedRawDate.split('-');
    let targetDateStr = new Date(y, m - 1, d).toLocaleDateString();
    titleEl.textContent = `Entries for ${targetDateStr}`;
    
    container.innerHTML = '<p style="color: #64748b; font-style: italic; font-size: 14px; text-align: center; margin: 16px 0;">Fetching records from cloud...</p>';

    const { data: history, error } = await _supabase
        .from('attendance_history')
        .select('*')
        .eq('date', targetDateStr);

    if (error) {
        container.innerHTML = `<p style="color: var(--danger-text); font-size: 14px; text-align: center;">Cloud Error: ${error.message}</p>`;
        return;
    }

    container.innerHTML = '';
    if (!history || history.length === 0) {
        container.innerHTML = '<p style="color: #64748b; font-style: italic; font-size: 14px; text-align: center; margin: 16px 0;">No entries made for this date yet.</p>';
        return;
    }
    
    history.forEach(record => {
        let div = document.createElement('div');
        div.className = 'entry-card';
        
        const isPresent = record.status === 'Present';
        const badgeClass = isPresent ? 'badge-present' : 'badge-absent';
        
        div.innerHTML = `
            <div>
                <div style="margin-bottom: 4px; display: flex; align-items: center; gap: 8px;">
                    <strong style="font-size: 15px; color: var(--text-main);">${record.name}</strong> 
                    <span class="badge ${badgeClass}">${record.status}</span>
                </div>
                ${isPresent ? `<div style="font-size: 13px; color: var(--text-sub);">In: <b>${record.intime}</b> | Out: <b>${record.outtime}</b></div>` : ''}
                <div style="font-size: 13px; color: var(--text-main); font-weight: 600; margin-top: 3px;">
                    OT: ₹${record.otamount} &bull; Adv: ₹${record.advance}
                </div>
            </div>
            <button class="btn-delete" onclick="deleteAttendance('${record.entryid}')">Delete</button>
        `;
        container.appendChild(div);
    });
}

document.getElementById('attendanceForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const saveBtn = document.getElementById('saveBtn');
    if(!selectEl.value) return alert("Please select a worker first!");
    
    saveBtn.disabled = true;
    saveBtn.textContent = "SAVING TO CLOUD...";

    let worker = labourList.find(w => w.id === selectEl.value);
    let status = document.getElementById('attendanceStatus').value;
    let selectedRawDate = document.getElementById('attendanceDate').value;
    
    const [y, m, d] = selectedRawDate.split('-');
    let finalSavedDateStr = new Date(y, m - 1, d).toLocaleDateString();
    
    let record = {
        entryid: "ATT_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
        date: finalSavedDateStr,
        labourid: worker.id,
        name: worker.name,
        wageattime: worker.wage,
        status: status,
        intime: status === "Present" ? document.getElementById('inTime').value : "--",
        outtime: status === "Present" ? document.getElementById('outTime').value : "--",
        otamount: status === "Present" ? (parseFloat(document.getElementById('otAmount').value) || 0) : 0,
        advance: parseFloat(document.getElementById('advanceAmount').value) || 0
    };

    const { error } = await _supabase.from('attendance_history').insert([record]);

    if (error) {
        alert("Failed to save to cloud: " + error.message);
    } else {
        alert("Attendance synced with Cloud successfully!");
        document.getElementById('labourSelect').value = "";
        document.getElementById('advanceAmount').value = "0";
        toggleTimeFields(); 
        renderRecentEntries();
    }
    saveBtn.disabled = false;
    saveBtn.textContent = "SAVE TO CLOUD";
});

window.deleteAttendance = async function(targetEntryId) {
    if (confirm("Are you sure you want to delete this attendance entry from the cloud?")) {
        const { error } = await _supabase
            .from('attendance_history')
            .delete()
            .eq('entryid', targetEntryId);

        if (error) {
            alert("Delete failed: " + error.message);
        } else {
            renderRecentEntries();
        }
    }
}
</script>

</body>
</html>
